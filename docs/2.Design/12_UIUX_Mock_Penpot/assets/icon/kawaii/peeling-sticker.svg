<!-- sticker-stamp.svg (Icon công cụ chèn sticker / icon lên ảnh) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Thân nhãn dán ngôi sao bo phồng màu vàng bơ -->
  <path d="M 16 5 
           C 17.5 5, 18.5 9, 20.5 10 
           C 22.5 11, 26.5 11, 27 13 
           C 27.5 15, 25 18, 25 20.5 
           C 25 22, 23.5 24, 21 25.5 
           L 18 21 
           C 16 21, 14 25, 11 26.5 
           C 9 27.5, 6 25, 6.5 22.5 
           C 7 20, 5 17, 5.5 14.5 
           C 6 12, 10 11.5, 11.5 10 
           C 13 8.5, 14.5 5, 16 5 Z" 
        fill="#FDE047" stroke="#3D2B1F" stroke-width="2" stroke-linejoin="round"/>

  <!-- Góc bóc nhãn dán hé ra (Peel Corner) màu hồng pastel -->
  <path d="M 21 25.5 L 18 21 L 25 20.5 C 24 23, 22.5 24.5, 21 25.5 Z" 
        fill="#F472B6" stroke="#3D2B1F" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Khuôn mặt Kawaii (2 mắt chấm + miệng cười) -->
  <circle cx="13" cy="14" r="0.9" fill="#3D2B1F"/>
  <circle cx="18" cy="14" r="0.9" fill="#3D2B1F"/>
  <path d="M 14.2 16 Q 15.5 17.2 16.8 16" fill="none" stroke="#3D2B1F" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Vệt sáng phản chiếu góc trên bên trái -->
  <circle cx="15" cy="8.5" r="1.1" fill="#FFFFFF"/>
</svg>
