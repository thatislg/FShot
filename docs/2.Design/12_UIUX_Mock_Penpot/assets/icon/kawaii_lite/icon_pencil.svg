<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pencil / Freehand - Kawaii Lite -->
  <!-- Coral Red body, Butter Yellow wood tip, Dark Walnut outline -->
  <!-- Body -->
  <path d="M7 23 l12 -12 l4 4 -12 12 z"
        fill="#FF7A70"
        stroke="#B91C1C"
        stroke-width="1.5"
        stroke-linejoin="round"
        stroke-linecap="round"/>
  <!-- Tip -->
  <path d="M7 23 l-3 6 6 -3 z"
        fill="#FDE047"
        stroke="#B45309"
        stroke-width="1.5"
        stroke-linejoin="round"
        stroke-linecap="round"/>
  <!-- Highlight dot -->
  <circle cx="11" cy="15" r="1.2" fill="#FFFFFF" opacity="0.85"/>
</svg>